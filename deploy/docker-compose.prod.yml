# Production stack for bbm-portal (Payload CMS v3 inside Next.js).
# Runs on the dedicated `portal-prod-tw` VPS (Timeweb ru-2, Zone RF) behind
# Caddy with automatic Let's Encrypt TLS for https://cms.bbm.academy.
#
# Differences from the dev `docker-compose.yml` at repo root (do NOT merge them):
#   - Postgres port is NOT published to the host (DB reachable only on the
#     internal compose network — prod hardening).
#   - The app is built from the repo Dockerfile and fronted by Caddy; no host
#     port is published for it.
#   - A profiled `migrate` service runs schema migrations + the admin seed as
#     one-off jobs (the standalone runtime image lacks pnpm/CLI/source — see
#     deploy/README.md).
#
# Compose file lives in `deploy/`; the Dockerfile is at the repo root, so the
# build context is the parent directory (`..`).
name: bbm-portal

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Dedicated env file with ONLY POSTGRES_USER/PASSWORD/DB — keeps the app's
    # Payload/S3/seed secrets out of the postgres container (and out of
    # `docker inspect postgres`). Loaded as the container's runtime env (NOT
    # compose `${...}` interpolation, which reads the auto-loaded `.env`, not this
    # file, and would inject empty values).
    env_file:
      - .env.postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapes compose interpolation so the container shell expands its own
      # runtime POSTGRES_* (set via env_file), not a parse-time empty value.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  # Astro SSR live-preview origin for `preview.bbm.academy` (epic #13 /
  # bbm-public-website#114). Unlike `app`, this is NOT built here: it is the
  # code-only image published by the site repo's GHCR CI (bbm-public-website
  # PR #125, `Dockerfile.preview`). It carries no CMS URL or token — they are
  # injected here at runtime:
  #   - PAYLOAD_API_URL: the internal compose address of the CMS (not a secret,
  #     so inline `environment`, not an env file). The container fetches each
  #     draft from `${PAYLOAD_API_URL}/api/globals/<slug>?draft=true` server-to-
  #     server over the compose network — never through Caddy/the public origin.
  #   - PAYLOAD_PREVIEW_TOKEN: the ONLY secret, kept in its own least-privilege
  #     `.env.preview` (a users API key — `users API-Key <key>` — NOT the app's
  #     Payload/S3 secrets), mirroring the postgres/app env split.
  # The image binds 0.0.0.0:4321 (Dockerfile.preview HOST/PORT); Caddy reverse-
  # proxies `preview.bbm.academy` to it. To update: `docker compose pull preview`
  # then `up -d preview` (GHCR auth — see deploy/README.md).
  preview:
    image: ghcr.io/bbm-academy-org/bbm-site-preview:latest
    restart: unless-stopped
    environment:
      PAYLOAD_API_URL: http://app:3000
    env_file:
      - .env.preview
    depends_on:
      - app
    expose:
      - '4321'

  # One-off tooling job: runs Payload migrations (default command) and the admin
  # seed (override command). Built from the Dockerfile `tooling` target, which
  # carries full node_modules + source + pnpm/Node 22 (no `next build`) — the
  # standalone `runner` image cannot run pnpm/Payload CLI. Gated behind the
  # `tools` profile so it never starts on a plain `docker compose up`.
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate pnpm seed:admin
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      # `tooling` target = deps + source + pnpm, WITHOUT the heavy `next build`
      # (migrations/seed don't need the built app). Fast to build, no 8 GB build
      # memory, and avoids the standalone runner's missing-CLI problem.
      target: tooling
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', 'migrate']
    profiles:
      - tools

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - preview

volumes:
  pgdata:
  caddy_data:
  caddy_config:
