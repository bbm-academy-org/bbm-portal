name: Bug
description: Something is broken or behaves differently from what was intended
type: Bug
labels:
  - channel:owner
body:
  - type: markdown
    attributes:
      value: |
        This form sets the built-in type **Bug** and the `channel:owner` label
        (from the web UI tasks are filed by the owner; agents go through
        `pnpm issue:create`). Set the **milestone** separately.
        A Bug without a reproduction is not picked up but returned to its author
        (`.claude/skills/task-canon/SKILL.md` §1).
  - type: textarea
    id: source
    attributes:
      label: Source
      description: >-
        On the basis of what this task exists — free text, one line. For
        example: "bug report from Anton in Mattermost 2026-08-04", "executive
        decision by the partners", "a colleague's request on a call", "caught it
        myself while working on #124", "payload dependency bumped to 3.86", "the
        mission changed".
      placeholder: bug report in Mattermost 2026-08-04
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        For a bug, Context is the reproduction: environment (dev stand/prod, URL,
        browser, version), steps, expected, actual.
      value: |
        **Environment:**

        **Steps:**

        1.

        **Expected:**

        **Actual:**
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this task fixes and what it explicitly does NOT fix (and where that goes instead).
      value: |
        **In scope:**

        -

        **Out of scope:**

        -
    validations:
      required: true
  - type: textarea
    id: spec-reference
    attributes:
      label: Spec reference
      description: 'Spec/ADR + §, or "no spec: <reason>". This field is never empty.'
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What to open/run and what to see in order to call the bug closed.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: A mirror of the native graph; the links themselves are drawn through the API (canon §3).
      value: |
        **Blocked by:**
        **Blocks:**
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Free text, logs, links to runs.
    validations:
      required: false
