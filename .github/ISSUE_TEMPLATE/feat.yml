name: Функциональность (Feature)
description: Новая возможность или заметное изменение поведения
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Форма выставляет штатный тип **Feature** сама. Отдельно проставь на
        задаче лейбл `source:*` (происхождение) и milestone — их форма задать не
        может, а `pnpm backlog:triage` их отсутствие покажет.
        Скелет и семантика полей: `.claude/rules/task-canon.md` §1.
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Происхождение задачи; продублируй его лейблом `source:*`.
      options:
        - source:owner
        - source:spec
        - source:retro
        - source:agent
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Почему сейчас, какую боль закрывает, откуда взялось решение. Ссылки на спеку/ADR/PRD.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 'Пустой «Out of scope» — запах: значит границы не думали.'
      value: |
        **In scope:**

        -

        **Out of scope:**

        -
    validations:
      required: true
  - type: textarea
    id: spec-reference
    attributes:
      label: Spec reference
      description: >-
        Спека/ADR + конкретный §. Если спека не нужна по гейту task-cycle stage 1a
        — напиши «нет спеки: <причина>». Пустым это поле не бывает.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Наблюдаемо и проверяемо — команда, URL, статус, файл. «Работает» критерием не является.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: >-
        Человекочитаемое зеркало нативного графа. Сами связи проводятся через API
        (sub-issue / blocked_by) — проза связью не считается (канон §3).
      value: |
        **Blocked by:**
        **Blocks:**
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Свободный текст. Stop-state-комментарии живут комментариями, не правкой тела.
    validations:
      required: false
