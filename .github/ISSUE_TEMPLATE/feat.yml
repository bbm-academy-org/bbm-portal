name: Feature
description: A new capability or a noticeable change in behavior
type: Feature
labels:
  - channel:owner
body:
  - type: markdown
    attributes:
      value: |
        This form sets the built-in type **Feature** and the `channel:owner`
        label (from the web UI tasks are filed by the owner; agents go through
        `pnpm issue:create`). Set the **milestone** separately — the form cannot
        set it, and `pnpm backlog:triage` will report it missing.
        Field skeleton and semantics: `.claude/skills/task-canon/SKILL.md` §1.
  - type: textarea
    id: source
    attributes:
      label: Source
      description: >-
        On the basis of what this task exists — free text, one line. For
        example: "bug report from Anton in Mattermost 2026-08-04", "executive
        decision by the partners", "a colleague's request on a call", "caught it
        myself while working on #124", "payload dependency bumped to 3.86", "the
        mission changed".
      placeholder: bug report in Mattermost 2026-08-04
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now, what pain it closes, where the solution came from. Links to the spec/ADR/PRD.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 'An empty "Out of scope" is a smell: the boundaries were never thought through.'
      value: |
        **In scope:**

        -

        **Out of scope:**

        -
    validations:
      required: true
  - type: textarea
    id: spec-reference
    attributes:
      label: Spec reference
      description: >-
        Spec/ADR + the specific §. If no spec is needed per the task-cycle stage
        1a gate, write "no spec: <reason>". This field is never empty.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Observable and checkable — a command, a URL, a status, a file. "It works" is not a criterion.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: >-
        A human-readable mirror of the native graph. The links themselves are
        drawn through the API (sub-issue / blocked_by) — prose does not count as
        a link (canon §3).
      value: |
        **Blocked by:**
        **Blocks:**
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Free text. Stop-state comments live as comments, not as body edits.
    validations:
      required: false
