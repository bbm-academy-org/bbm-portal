# Пустая issue запрещена: постановка без скелета канона §1 — это заявка, а не
# задача, и разбирать её приходится тому, кто будет делать.
# Канон: .claude/rules/task-canon.md
blank_issues_enabled: false
contact_links:
  - name: Завести задачу из сессии агента
    url: https://github.com/bbm-academy-org/bbm-portal/blob/main/.claude/rules/task-canon.md
    about: >-
      Агент заводит задачу только через `pnpm issue:create` — обёртка валидирует
      таксономию до создания, ставит задачу на борд и выставляет Status=Todo.
      Формы ниже — путь для владельца из веб-интерфейса.
