# Guards that read the PR's own body/metadata rather than the repo tree. They
# live in a DEDICATED workflow because they must also re-run on the `edited`
# activity type: fixing a PR body — adding the missing product note, repointing
# a `Closes` line — has to clear the check without re-running the whole test and
# build matrix. Folding `edited` into ci.yml was rejected: the `ci` aggregate
# treats a skipped need as red (see ci.yml), so a body-only edit would poison it.
#
# Severity: five of the six jobs here are BLOCK since 2026-09-02 (#438);
# `product-note` is the one that stays WARN. `needs` does not cross workflows, so
# none of them can ever be in ci.yml's needs-list, and canon §2.1 required the
# cross-workflow mechanism to be decided AT the promotion. It was, and the
# decision is recorded in §2.1 — read it there. What it means for this file:
#
#   1. A promoted job carries no `continue-on-error`, so `pnpm pr:land` no longer
#      demotes its FAILURE check-run to a printed warning (tools/gh/pr-land.mjs,
#      `classifyChecks` — the WARN plane of #397 is resolved from these very
#      files on the PR's base ref). A finding turns the merge gate RED.
#   2. A promoted job carries no `if:` fence either. `classifyChecks` passes a
#      SKIPPED conclusion, so a title-only edit after a red run would have
#      replaced the FAILURE check-run with a SKIPPED one and greened the gate. A
#      guard that can be skipped on demand is not a BLOCK, and these jobs are
#      cheap — the fence bought nothing worth that hole. `product-note` keeps its
#      fence precisely because it is still WARN.
#
# The honest limit: `.github/branch-protection.json` still requires only the `ci`
# context, so a merge performed by hand in the GitHub UI bypasses these five. The
# canon merge route is `pnpm pr:land` (.claude/skills/merge-when-green).
#
# Body reliability: each step passes `PR_BODY` from the event payload rather than
# letting the guard read it back through `gh pr view`. The payload is always
# current for the event that triggered the run, while a REST read right after PR
# creation has returned a stale or absent body — and a retry cannot fix that
# class, because a stale read still succeeds.
#
# Auth: every job carries `permissions:` and every step `GH_TOKEN` + `PR_NUMBER`
# (the workflow-auth guard in ci.yml fails the build if one is missing).
name: PR body guards

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  # NOT cancel-in-progress — and since #397 for a sharper reason than before.
  # `pnpm pr:land` now DOES know which job is `continue-on-error` (it resolves the
  # WARN plane from the workflow definitions on the PR's base ref), but it demotes
  # only `FAILURE`: a CANCELLED check-run still reads as red, on either plane,
  # because a run that did not finish proved nothing. Cancelling a superseded run
  # here would therefore leave CANCELLED check-runs blocking a merge these WARN
  # guards are never supposed to block. The rule of record is canon §2.1
  # (docs/ci-guardrails.md) — read it there, do not restate it here. The `if:`
  # no-op fence below is safe by contrast: SKIPPED passes the gate. These jobs are
  # cheap, so a superseded run is left to finish rather than turned into a false
  # verdict.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Least-privilege floor for the whole workflow (#220). Every job below already
# declares its own `permissions:` block, and a job-level block REPLACES this one
# rather than merging with it — so this floor changes nothing for the jobs that
# exist today. It is here for the next job added to this file: without it a job
# that forgets its block inherits the org/repo default instead of the minimum.
permissions:
  contents: read

jobs:
  # BLOCK — `Closes #<epic>` on a PR whose target still has open sub-issues.
  # Needs `issues: read` on top of the usual pair for the sub-issues endpoint.
  # Promoted WARN -> BLOCK on 2026-09-02 (#438): clean window, no recorded defect
  # in either direction, and the rule reads the native sub-issue graph rather
  # than prose. Unblocked in the PR body — repoint the `Closes` line at the leaf.
  epic-autoclose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:epic-autoclose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # BLOCK — an open PR row with no assignee or no milestone cannot be triaged.
  # It reads PR fields rather than the body, so it re-runs on a push
  # (`synchronize`) rather than on the field edit itself.
  # Promoted WARN -> BLOCK on 2026-09-02 (#438). Its one DEBT.md line (#80,
  # agent-opened PRs arriving without the fields) records a TRUE positive, which
  # §4 clause 3 counts FOR promotion, and it has not fired since the 2026-08-15
  # sweep. Unblocked with one `gh pr edit --add-assignee … --milestone …`; the
  # re-run comes with the next push, so run it before the last one.
  assignee-milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:assignee-milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # BLOCK — a UI diff with no recorded Stage-B verdict (guard from task 7.7/#138).
  # `--severity block` was always passed ON PURPOSE, so the script has given a
  # real signal (canon §4 clause 1) throughout the soak; the promotion of
  # 2026-09-02 (#438) is the plane catching up with it.
  # All three recorded defects are false PASSES — an asset-only visual change is
  # invisible to the path-only classifier (#230), a parent-comment GO satisfies
  # every later slice (#299), and the GO/PLACEHOLDER ordering could accept an
  # unfilled template (#359) — so the guard can miss a UI diff but cannot invent
  # one. Unblocked in the PR body with a `Stage-B:` line, in one of the three
  # shapes .claude/rules/design-process.md §2 defines.
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:stage-b --severity block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # BLOCK — a feature PR with no spec behind it (guard from task 7.4/#135). Reads
  # the PR body AND each linked issue's `## Spec reference`, so it needs
  # `issues: read` on top of the usual pair. `--severity block` was always passed,
  # for the same reason as stage-b (canon §4 clause 1).
  # Promoted WARN -> BLOCK on 2026-09-02 (#438). It is the one promoted guard
  # with a live false-BLOCK class — a chore slice of a Feature-typed epic can
  # inherit the parent's type through `Part of #N` (DEBT.md, #299/PR #303 N3) —
  # and it is promotable anyway because that class is bounded by an escape
  # reachable without leaving the PR: a `spec-exempt: <reason>` line in the body.
  # §3 clause (d). Demotion per §4 on the first confirmed false block.
  spec-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:spec-link --severity block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # BLOCK — a deleted spec/ADR, plus the repo-wide spec status sweep that rides
  # along in the same script (#157, tranche 2). It lives HERE rather than in
  # ci.yml because the sanctioned escape is a `spec-deletion:` line in the PR
  # body: a PR that adds the marker must be able to clear the check without
  # re-running the build matrix, which is what this workflow's `edited` trigger
  # is for. `fetch-depth: 0` is required — the deletion class diffs against
  # `origin/main`, and the default shallow checkout has no such ref, which the
  # guard would (correctly, canon §8) report as fail-closed rather than clean.
  # Promoted WARN -> BLOCK on 2026-09-02 (#438): clean window, no recorded defect
  # in either direction, and the sanctioned escape below is what bounds it.
  spec-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:spec-deletion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # WARN — a user-visible change with no note the owner would read. Its promotion
  # is tied to task 7.6 (#137, release-note delivery), not to the §4 clock: a
  # note nothing delivers is not worth blocking a merge over.
  product-note:
    if: github.event.action != 'edited' || github.event.changes.body != null
    continue-on-error: true # WARN since 2026-08-05 — canon §5, promotion tied to #137
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:product-note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # WARN — a UI diff whose PR body records no `UX-record:` block (guard from
  # #433). Same wiring as `stage-b` and for the same reason: `--severity block`
  # so the script gives a REAL signal (canon §4 clause 1 — a guard that prints
  # and exits 0 is a stub and is not promotable), `continue-on-error` so the CI
  # plane stays WARN. Promotion is then one line. It reads linked-issue comments
  # as well as the body, hence `issues: read`.
  ux-record:
    if: github.event.action != 'edited' || github.event.changes.body != null
    continue-on-error: true # WARN since 2026-09-02 — canon §5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ux-record --severity block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
