# Severity of every job below is defined by docs/ci-guardrails.md §2.1 and is
# READ OFF THIS FILE, not off any prose: BLOCK = no `continue-on-error` AND the
# job is in the `ci` meta-job's needs-list; WARN = `continue-on-error: true` AND
# absent from that list. Promotion of a WARN job to BLOCK is three edits — drop
# the `continue-on-error` line, add the job to `needs`, update the canon's §5 row.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege floor for the whole workflow (#220). `contents: read` is all a
# job needs to check out, install and run a tree-local guard or the test tier —
# which is every job here except the ones that read PR metadata through `gh`
# (`design-fidelity`, `test-presence`, `tdd-order`).
#
# A job-level `permissions:` block REPLACES this one, it does not merge with it:
# any job that declares its own must list EVERY scope it needs, `contents: read`
# included. Those three below already do. Widen there, never here — raising
# this floor hands the extra scope to every job in the file.
permissions:
  contents: read

jobs:
  # BLOCK — the repo's original gate, unchanged. The heaviest job by far: it
  # carries `next build` on top of the unit tier, hence its own timeout budget.
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `tests/unit/debt-merge-driver.spec.ts` verifies that every DEBT.md
          # anchor ever added still exists, so the blocking unit-test job needs
          # full history rather than the default shallow checkout.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Lint CSS (stylelint)
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated Payload types match config
        run: pnpm generate:types:check

      # ADR-002: machine-enforced module boundaries of the modular monolith
      - name: Module boundaries (dependency-cruiser)
        run: pnpm boundaries

      # Unit tier only — tests/int needs the live dev DB and stays local (#48)
      - name: Unit tests
        run: pnpm test:unit

      # #63 — build smoke: catch a broken `next build` on PRs. Runs in this same
      # job to reuse the install + pnpm cache above (no second install). Needs no
      # secrets: payload.config reads PAYLOAD_SECRET/DATABASE_URL with `|| ''`
      # fallbacks and db push is off, so nothing connects at build time — same as
      # the Dockerfile, which builds with no env. `next build` also typechecks.
      - name: Build (next build)
        run: pnpm build

  # BLOCK — the guards' own tests. A guard whose test tier is not in the
  # needs-list can rot silently while still reporting green (canon §5).
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard specs
        run: pnpm test:guards

  # BLOCK — the platform DB integration tier (`tests/int/platform`). Until this
  # job existed, `core` was covered by specs no CI run executed: the tier needs a
  # live Postgres, so it stayed local (#48) and a broken migration or a lost
  # constraint could reach `main` with every check green.
  #
  # `postgres:17-alpine` — the version prod and the dev stand run
  # (deploy/docker-compose.prod.yml, infra/dev-stand/compose.core.yml). Matching it
  # matters here specifically: this tier asserts partial unique indexes, CHECKs and
  # the `double precision` round-trip, which is exactly the class of behaviour a
  # major-version difference moves.
  #
  # Env var only, no `.env` file: `tools/platform/load-env.mjs` treats a missing
  # `.env` as normal (prod and CI have none) and the environment wins over it
  # anyway. Payload is not involved and no `DATABASE_URL` is set — the platform
  # database is a SEPARATE database with no fallback onto `cms` (ADR-004 §3), and a
  # `DATABASE_URL` here would only make that fallback look plausible.
  #
  # `platform:migrate` runs the ensure step first, so the empty `postgres` service
  # gets the `platform` database created before drizzle applies the migrations.
  #
  # Since #278 the job runs the two-role arrangement of EARS-30 rather than the
  # service superuser: `platform:roles:ensure` splits the container into an
  # application role and a migrating role, and the integration tier then connects
  # as the application one. That ordering is the point — this is the only tier in
  # the estate where the privilege echelon is asserted on every PR, and asserting
  # it as a superuser would assert nothing.
  platform-int:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Three roles, three jobs (#278, EARS-30). `postgres` is the SERVICE
      # container's superuser and is used for exactly one thing — creating the
      # other two. `ci_platform_app` is what the integration tier connects as, so
      # the tier really runs against the least-privilege role production will use;
      # `ci_platform_migrate` owns `core` and is what drizzle-kit connects as.
      # The names are per-environment on purpose: the dev stand and prod name
      # theirs differently, and nothing in the code hardcodes any of the three —
      # the fixed names are the privilege GROUPS the roles belong to.
      # Throwaway credentials for an ephemeral container on localhost, exactly
      # like the `postgres:postgres` above them.
      PLATFORM_SUPERUSER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PLATFORM_DATABASE_URL: postgres://ci_platform_app:ci_platform_app@localhost:5432/platform
      PLATFORM_MIGRATE_DATABASE_URL: postgres://ci_platform_migrate:ci_platform_migrate@localhost:5432/platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Provisioning, not migration: a non-superuser migration can neither
      # CREATE ROLE nor take ownership, so this step runs first and as the
      # superuser. On the empty service container it creates the roles only —
      # `platform` does not exist yet, and the grants ride in with the migration
      # a step later.
      - name: Platform roles (provisioning)
        run: pnpm platform:roles:ensure
      - name: Platform migrations (ensure + drizzle)
        run: pnpm platform:migrate
      - name: Platform integration tier
        run: pnpm exec vitest run --config ./vitest.config.mts tests/int/platform

  # BLOCK from day 0 under the canon §3 class-1 mandate (deterministic tree
  # check — no network, no PR metadata, no heuristics, so no false-positive class
  # to soak for). This is what makes "a guard without a test does not get merged"
  # mechanical rather than a convention.
  guard-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:guard-test-coverage

  # BLOCK from day 0 — a UI diff built on a surface that has no VISUAL design
  # source (#359). Recorded mandate: docs/ci-guardrails.md §5, row
  # `design-fidelity` (§3 class 3 — owner-mandated process guard whose WARN form
  # already failed: the prose rule was live in .claude/rules/design-process.md §1
  # while #312/#314 built the `/p` wireframe as the design, and the guards that
  # flank it — `stage-b` and `ui-tokens`, both WARN at that time — were live too and
  # changed nothing; `stage-b` has since been promoted, canon §5).
  #
  # It lives in `ci.yml` and in the `ci` needs-list because that IS what BLOCK
  # means here (§2.1): a job in `pr-body-guards.yml` cannot be in that list at all.
  # The cost of that placement, named rather than discovered: `ci.yml` does not
  # trigger on `edited`, so adding the missing `Design-fidelity:` line to the PR
  # body does not by itself re-run this job. It does not need a push either — the
  # guard reads the body LIVE through `gh pr view`, so re-running the failed job
  # picks up the edit.
  #
  # No `--severity` flag on purpose: this guard has exited 1 on a finding since day
  # 0, so a dial could only ever weaken it (the reasoning of §6.1). Reads PR
  # metadata through `gh`, hence the auth block workflow-auth enforces; `issues:
  # read` on top of the usual pair, because the owner's record may live in a
  # linked-issue comment.
  design-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:design-fidelity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # A NEW platform module whose test did not land in a STRICTLY EARLIER commit of
  # the same PR (#355). Severity of record: docs/ci-guardrails.md §5, row
  # `tdd-order` — read that row, not this comment.
  #
  # WARN by the §3 DEFAULT, settled 2026-08-27 — and the reasoning is kept because
  # an earlier draft of this job got it wrong. A day-0 BLOCK was claimed under §3
  # class 1; class 1 excludes this guard by name, because its only input is PR
  # metadata fetched over the network and judged with a substring match, which is
  # exactly what §3's closing line sends to a WARN soak. No owner class-3 mandate
  # was sought or granted: the canon's own default decided it, so there is nothing
  # contested left here. Promotion to BLOCK follows §4 (≥4 clean weeks) —
  # earliest 2026-09-24, the usual three edits (drop `continue-on-error`, add the
  # job to the `ci` needs-list, update the §5 row).
  #
  # The PRE-COMMIT half of this same guard (`--staged`, on the simple-git-hooks
  # line) is untouched by that and blocks locally from day one: it reads only the
  # local tree and index through git plumbing, meeting class 1 on its own terms.
  # Two enforcement points, two severities, both recorded in the §5 row.
  #
  # The guard header enumerates the false-positive class honestly — two paths
  # closed in code (merge-commit first-parent diffs, truncated commit file lists),
  # one open and benign (substring needles: a false PASS, never a false BLOCK).
  #
  # No `--severity` flag: the guard has exited 1 on a finding since day 0, so the
  # dial `stage-b` and `spec-link` need would be a no-op here that could only ever
  # weaken it (§6.1).
  #
  # Reads PR metadata through `gh` (the REST commits endpoints, not `--json
  # files` — the shallow checkout has no base ref to walk), hence the auth block
  # workflow-auth enforces. `pull-requests: read` covers both endpoints.
  tdd-order:
    continue-on-error: true # WARN since 2026-08-27 — canon §5, earliest promotion 2026-09-24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:tdd-order
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # BLOCK — production changed with no test in the diff and none in the tree.
  # Reads the PR's changed-file set through `gh`, hence the auth block
  # (workflow-auth enforces its presence).
  #
  # Called `tdd-signal` until 2026-08-27 (#355). The rename is not cosmetic: this
  # job answers «does a test EXIST», and a green check under the old name was
  # read as an attestation that TDD had happened — which it was not, and which
  # PR #354 proved by passing it with an implementation written before its tests.
  # The order question is the `tdd-order` job below. Renaming changed no rule, so
  # the §4 promotion clock is untouched (earliest 2026-09-02).
  #
  # Promoted WARN -> BLOCK on 2026-09-02 (#438) under the §4 clauses. Its one
  # known defect is a false PASS, not a false BLOCK: the substring path match
  # lets a spec that merely MENTIONS a module path count as covering it
  # (DEBT.md), so the guard can miss a violation but cannot invent one.
  test-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:test-presence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # BLOCK from day 0 — an ungated route handler on the modules' HTTP surface
  # `/api/p/*` (#315, the deferred §11 row of the consolidation spec). Recorded
  # mandate: docs/ci-guardrails.md §5, row `endpoint-authz` (§3 classes 1 and 2
  # together — a deterministic tree check over this repo's own handler
  # convention, over a failure spec 311 EARS-461/EARS-462 records as a
  # data-protection defect, so a WARN soak would itself be the risk). Escape
  # hatch on the CI plane: `// endpoint-authz-ok: <reason>` in the diff.
  endpoint-authz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:endpoint-authz

  # BLOCK — dev placeholder / untracked stub marker on the render surface.
  # Promoted WARN -> BLOCK on 2026-09-02 (#438): clean window, no known defect
  # in either direction. It is the guard #438's own body omitted; the register
  # (canon §5), not the issue text, is the specification.
  no-stub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:no-stub

  # WARN — the UI kit's colour values come from one theme entry, and that entry
  # is the standard shadcn/ui neutral theme the owner adopted on 2026-08-26
  # (#360; consolidation §10/§11, guard rewritten from the #312 palette form).
  ui-tokens:
    continue-on-error: true # WARN since 2026-08-26 — canon §5, earliest promotion 2026-09-23
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ui-tokens

  # BLOCK — meta-guard over this very file: a gh-gated job with no `permissions:`
  # + `GH_TOKEN` goes red before it evaluates its own rule, which looks exactly
  # like a real finding and quietly spends that guard's promotion window.
  #
  # Promoted WARN -> BLOCK on 2026-09-02 (#438). All three recorded defects are
  # false PASSES (a guard invoked through a composite `uses:` action, a
  # matrix-interpolated `pnpm lint:` invocation, and no check that a workflow
  # declares a top-level `permissions:` floor at all — DEBT.md), so blocking on
  # what it does catch cannot stop a legitimate PR.
  workflow-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:workflow-auth

  # BLOCK — the always-on agent context (CLAUDE.md, AGENTS.md,
  # .claude/rules/*.md) past its per-file budget, or the whole corpus past the
  # aggregate cap. Wired by #157; no epic-7 task wired it, and wiring is what
  # started the §4 clock for this plane, which ran out on 2026-09-02.
  #
  # Both planes now carry the same severity; they did not always. As a CLI
  # guard it has been BLOCK by exit code (canon §6.1, day-0 §3 class-1 mandate —
  # a deterministic tree check) since day 0, while the CI job soaked as WARN
  # like every other freshly wired job. It needs no `--severity block` flag (the pattern
  # stage-b and spec-link follow): those two default to exit 0 on a finding and
  # the flag buys them a real signal; this one has exited 1 since day 0, so the
  # flag would be a no-op dial that could only ever weaken it.
  #
  # The MEMORY.md index lives outside git and is simply absent here — the guard
  # skips what does not exist, so CI measures the repo files only.
  #
  # Promoted WARN -> BLOCK on 2026-09-02 (#438), which closes the asymmetry the
  # §5 note described: the same script has been BLOCK on its CLI plane since day
  # 0 under §3 class 1, and its false-positive class is empty by construction
  # (byte and line counts over checked-out files). The two planes now agree.
  instruction-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:instruction-budget

  # WARN — a test title that ATTEMPTS the EARS prefix and misspells it, so the
  # `EARS-N` grep the spec canon promises silently misses it (#157, tranche 2).
  #
  # HELD at WARN on 2026-09-02 (#438) over a declared FALSE-BLOCK class, which
  # #447 then closed by narrowing ATTEMPT_RE — a substantive rule change, so the
  # §4 clause-2 clock restarted. The remaining condition and the date it yields
  # are the register's to state, and are NOT restated here: this comment carried
  # a paraphrase of them until #447, and the paraphrase is what went stale.
  # Canon: docs/ci-guardrails.md §5, row `ears-naming`.
  ears-naming:
    continue-on-error: true # WARN since 2026-08-05 — severity and window: docs/ci-guardrails.md §5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ears-naming

  # WARN — EARS clause ↔ test traceability, both directions: a declared clause
  # with no test, and a test citing a clause no spec declares (#157, tranche 2).
  #
  # HELD at WARN on 2026-09-02 (#438). The window is clean, but #288 is OPEN and
  # is a false-BLOCK class: the EARS id keyspace is flat and global, so ids
  # collide across specs and retired ids are still counted. New condition: land
  # #288, then a 4-week clean window — earliest promotion 2026-09-30.
  ears-test:
    continue-on-error: true # WARN since 2026-08-05 — canon §5, earliest promotion 2026-09-30
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ears-test

  # WARN — audit coverage over the migration chain: a `core` table that landed
  # with no `core.audit_row_change()` trigger and no allowlist entry, or a column
  # in neither the trigger's whitelist arguments nor the excluded-columns list
  # (#276, spec 201 EARS-19/20/22/29).
  #
  # WARN by EARS-20 and by canon §3: the guard matches REGEXES OVER SQL TEXT, so
  # it has a real false-positive class to soak and claims no day-0 mandate. The
  # truth-level half of the same question blocks from day 0 already — the
  # `pg_trigger` assertions in `tests/int/platform/audit-coverage.int.spec.ts`,
  # which run in the BLOCK `platform-int` job above.
  #
  # Severity of record is the JOB flag, the shape every WARN guard in this file
  # uses; ci.yml has no batch job to hang a step-level flag on (the batch shape
  # #205/PR #206 attempted never landed, and workflow-auth reads job severity off
  # every job here regardless). The annotate step is the §8 outcome aggregation
  # kept from EARS-20's wiring sentence: `continue-on-error` makes a WARN
  # finding invisible in a collapsed log, so some step must read
  # `steps.<id>.outcome` and say so.
  audit-coverage:
    continue-on-error: true # WARN since 2026-08-19 — canon §5, earliest promotion 2026-09-16
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: audit-coverage
        run: pnpm lint:audit-coverage
      - name: Annotate the WARN finding
        if: always() && steps.audit-coverage.outcome == 'failure'
        run: echo "::warning title=audit-coverage::a core table or column has no audit coverage decision — see the step log (docs/ci-guardrails.md §5)"

  # BLOCK — the committed SSOT snapshot has drifted from its master. The master
  # of the finmodel variables is `ssot/finmodel.yaml` in the PRIVATE repo
  # bbm-academy-org/bbm-kb; this repo holds a snapshot under
  # src/lib/finmodel/snapshot so neither the build nor the tests reach the
  # network. That arrangement is only honest while something notices the two
  # drifting apart — otherwise "fix the number in one place" silently stops
  # recomputing everywhere, which is the exact failure the SSOT contract exists
  # to prevent (spec §5, anti-staleness AC of #192).
  #
  # BLOCK from day 0 by that AC, not by the §3 class-1 mandate: the check does
  # reach the network, so its false-positive class is infrastructure, not
  # heuristics. The comparison itself is exact content equality against
  # bbm-kb@main — there is nothing to soak.
  #
  # `KB_READ_TOKEN` (fine-grained PAT, read-only contents on bbm-kb) is required
  # because the master repo is private: the workflow's own GITHUB_TOKEN cannot
  # see it. Two consequences worth naming rather than discovering: without the
  # secret the job is red on every PR (deliberate — a freshness check that cannot
  # read the master has proved nothing, and §2.2's fail-open is a HOOK rule, not
  # a CI one), and secrets are withheld from fork PRs, so this job cannot pass on
  # one. Both are acceptable here: every PR in this repo comes from a branch of
  # this repo (§2.1.1, second row).
  ssot-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SSOT snapshot freshness
        run: pnpm ssot:check
        env:
          KB_READ_TOKEN: ${{ secrets.KB_READ_TOKEN }}

  # ─── Meta-job: the single aggregate status check ────────────────────────────
  # The needs-list IS the BLOCK set (canon §2.1). WARN jobs are deliberately
  # absent; PR-body guards live in pr-body-guards.yml and cannot be listed here
  # at all (`needs` does not cross workflows — canon §2.1 says what to do when
  # one of them is promoted).
  #
  # The job name must stay literally `ci`: it is the context named in
  # .github/branch-protection.json, so renaming it silently unhooks the gate.
  ci:
    needs:
      [
        lint-and-typecheck,
        guard-tests,
        guard-test-coverage,
        platform-int,
        ssot-freshness,
        design-fidelity,
        endpoint-authz,
        test-presence,
        no-stub,
        workflow-auth,
        instruction-budget,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A required job must SUCCEED. `skipped` and `cancelled` are red too: a job
      # that never ran proved nothing, and treating only `failure` as red lets a
      # broken upstream job green the aggregate on a run where nothing was built
      # or tested.
      - name: Aggregate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed, was skipped, or was cancelled"; exit 1
          fi
          echo "All required jobs green"
