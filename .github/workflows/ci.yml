# Severity of every guard below is defined by docs/ci-guardrails.md §2.1 and is
# READ OFF THIS FILE, not off any prose. Since #205 the guards are STEPS of one
# batch job rather than a job each, so severity is read at STEP level:
#   BLOCK = a plain step (no `continue-on-error`) in a job that IS in the `ci`
#           meta-job's needs-list — its failure fails the job and the aggregate;
#   WARN  = a step carrying `continue-on-error: true` — it can never fail its job.
# Promotion of a WARN guard to BLOCK is four edits, enumerated in the canon's §4
# — two of them here (drop that step's `continue-on-error`, drop its row from the
# `WARN guard outcomes` step below), plus the step's comment and the canon's §5
# row. There is no `needs` change to make: the batch job is already in the list.
#
# Why one job (#205): each guard used to own a job, and on the self-hosted pool
# the per-job checkout + `pnpm install` cost far more than the guards themselves.
# The batch installs once and runs the guards sequentially.
#
# Every guard step carries an `id:` and
# `if: ${{ !cancelled() && steps.install.outcome == 'success' }}`. The first
# clause keeps a failed BLOCK step from hiding the guards after it; the second
# keeps a BROKEN INSTALL from fabricating findings — without it every guard would
# run against a missing `node_modules`, fail, and be annotated as a finding of a
# rule it never evaluated, poisoning the §4 clock this file just made
# load-bearing (review of PR #206). The final aggregation step turns each WARN
# outcome into a `::warning::` annotation plus a step-summary row, and reports a
# skipped guard as «did not run» rather than as a finding. WARN findings must
# stay VISIBLE — `continue-on-error` alone would bury them in a collapsed log.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new COMMIT on a PR cancels that PR's superseded run. Nothing else cancels,
  # and both halves of that are deliberate (review of PR #206):
  #
  #   — a `main` push gets a UNIQUE group (`github.run_id`), so main runs never
  #     share a group and there is nothing to supersede. Grouping them by
  #     `github.ref` would NOT have been safe: GitHub cancels a PENDING run when
  #     another pending run enters the group whatever `cancel-in-progress` says
  #     (see §2.1), and on this pool a run has been observed queued 18m56s — so
  #     two merges inside one window would leave a CANCELLED run on `main`, which
  #     `tools/gh/verify-base-ci-green.mjs` counts as RED and would announce to
  #     every session as "main is already broken";
  #   — the flag is narrowed to `synchronize`. `reopened` fires on the SAME head
  #     sha, and cancelling there would leave CANCELLED check-runs on a
  #     STILL-CURRENT head — the exact class `pnpm pr:land` reads as a block, and
  #     the reason `pr-body-guards.yml` never cancels at all (canon §2.1).
  #
  # What makes the remaining case safe: a `synchronize` cancellation is always
  # caused by a new commit, so its CANCELLED check-runs land on the SUPERSEDED
  # sha, and nothing reads a stale sha — the `ci` aggregate judges only its own
  # run, and `pr:land` reads the rollup of the CURRENT head (turning red anyway
  # if head moved while it waited).
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  # BLOCK — the repo's original gate, unchanged. The only heavy job: it carries
  # `next build` (plus the unit tier), which does not fit the 1.5 GiB light lane.
  lint-and-typecheck:
    runs-on: [self-hosted, linux, x64, bbm-ci, node22, heavy, ci]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Lint CSS (stylelint)
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

      # ADR-002: machine-enforced module boundaries of the modular monolith
      - name: Module boundaries (dependency-cruiser)
        run: pnpm boundaries

      # Unit tier only — tests/int needs the live dev DB and stays local (#48)
      - name: Unit tests
        run: pnpm test:unit

      # #63 — build smoke: catch a broken `next build` on PRs. Runs in this same
      # job to reuse the install + pnpm cache above (no second install). Needs no
      # secrets: payload.config reads PAYLOAD_SECRET/DATABASE_URL with `|| ''`
      # fallbacks and db push is off, so nothing connects at build time — same as
      # the Dockerfile, which builds with no env. `next build` also typechecks.
      - name: Build (next build)
        run: pnpm build

  # The light guard batch (#205) — one checkout + one install for all eight tree
  # guards. The job itself carries NO `continue-on-error` and IS in the `ci`
  # needs-list, which is what lets a BLOCK step below reach the aggregate; the
  # WARN steps are fenced individually so they never can.
  #
  # `permissions:` sits on the job (a job-level block fully REPLACES a
  # workflow-level one) because one of the steps reaches GitHub through `gh`;
  # `workflow-auth` enforces the pair plus the step's GH_TOKEN + PR_NUMBER.
  guards:
    runs-on: [self-hosted, linux, x64, bbm-ci, node22, light, ci]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        run: pnpm install --frozen-lockfile

      # BLOCK — the guards' own tests. A guard whose test tier is not blocking
      # can rot silently while still reporting green (canon §5).
      - name: guard-tests — the guards' own specs
        id: guard-tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:guards

      # BLOCK from day 0 under the canon §3 class-1 mandate (deterministic tree
      # check — no network, no PR metadata, no heuristics, so no false-positive
      # class to soak for). This is what makes "a guard without a test does not
      # get merged" mechanical rather than a convention.
      - name: guard-test-coverage — every guard has its spec
        id: guard-test-coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint:guard-test-coverage

      # WARN — production changed with no test in the diff and none in the tree.
      # Reads the PR's changed-file set through `gh`, hence the auth env below
      # (workflow-auth enforces its presence, and the job's `permissions:`).
      - name: tdd-signal — production change with no test
        id: tdd-signal
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true # WARN since 2026-08-05 — canon §5, earliest promotion 2026-09-02
        run: pnpm lint:tdd-signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # WARN — dev placeholder / untracked stub marker on the render surface.
      - name: no-stub — placeholder on the render surface
        id: no-stub
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true # WARN since 2026-08-05 — canon §5, earliest promotion 2026-09-02
        run: pnpm lint:no-stub

      # WARN — meta-guard over this very file: a gh-gated job with no
      # `permissions:` + `GH_TOKEN` goes red before it evaluates its own rule,
      # which looks exactly like a real finding and quietly spends that guard's
      # promotion window.
      - name: workflow-auth — gh-gated jobs carry their auth block
        id: workflow-auth
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true # WARN since 2026-08-05 — canon §5, earliest promotion 2026-09-02
        run: pnpm lint:workflow-auth

      # WARN on the CI plane — the always-on agent context (CLAUDE.md, AGENTS.md,
      # .claude/rules/*.md) past its per-file budget, or the whole corpus past the
      # aggregate cap. Wired by #157; no epic-7 task wired it, and wiring is what
      # starts the §4 clock for this plane (earliest promotion 2026-09-02).
      #
      # Two planes, deliberately different severities for the same script: as a
      # CLI guard it is BLOCK by exit code (canon §6.1, day-0 §3 class-1 mandate —
      # a deterministic tree check), while on the CI plane it soaks as WARN like
      # every other freshly wired guard. It needs no `--severity block` flag (the
      # pattern stage-b and spec-link follow): those two default to exit 0 on a
      # finding and the flag buys them a real signal; this one has exited 1 since
      # day 0, so the flag would be a no-op dial that could only ever weaken it.
      #
      # The MEMORY.md index lives outside git and is simply absent here — the
      # guard skips what does not exist, so CI measures the repo files only.
      - name: instruction-budget — always-on context size
        id: instruction-budget
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true # WARN since 2026-08-05 — canon §5, earliest promotion 2026-09-02
        run: pnpm lint:instruction-budget

      # WARN — a test title that ATTEMPTS the EARS prefix and misspells it, so the
      # `EARS-N` grep the spec canon promises silently misses it (#157, tranche 2).
      - name: ears-naming — misspelled EARS test prefix
        id: ears-naming
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true # WARN since 2026-08-05 — canon §5, earliest promotion 2026-09-02
        run: pnpm lint:ears-naming

      # WARN — EARS clause ↔ test traceability, both directions: a declared clause
      # with no test, and a test citing a clause no spec declares (#157, tranche 2).
      - name: ears-test — EARS clause ↔ test traceability
        id: ears-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true # WARN since 2026-08-05 — canon §5, earliest promotion 2026-09-02
        run: pnpm lint:ears-test

      # A WARN step is green at the job level by construction, so without this the
      # finding would exist only as a line buried in a collapsed step log. The §4
      # promotion clock ("zero live findings in the window") is counted off these
      # annotations, so they are part of the guard, not decoration. `always()` —
      # the table must appear even when a BLOCK step above failed.
      #
      # This step is PLUMBING of the batch job, not a guard, and deliberately
      # carries no `continue-on-error`: by §2.1's letter that makes it BLOCK, and
      # that is the wanted reading — a job whose findings report broke has not
      # reported its findings, and must not look clean (canon §2.1, "the
      # BLOCK/WARN reading is about guard steps").
      #
      # It reports three distinct states, because a guard that NEVER RAN is not a
      # clean guard and is not a finding either: `skipped` means the shared
      # install failed above, and counting that as a finding is exactly the
      # fabricated-red class §4 forbids (review of PR #206).
      - name: WARN guard outcomes
        if: always()
        run: |
          {
            echo "### WARN guard outcomes"
            echo
            echo "| Guard | Outcome |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Why a guard step can be `skipped` at all, and the two causes are not
          # the same news: either the shared install failed (its findings would
          # have been fabricated — see the fence on the guard steps), or the RUN
          # was cancelled, which after the concurrency block above is the routine
          # case on every new commit. Blaming setup for a cancellation would send
          # the reader to debug an install that was fine.
          if [ "${{ steps.install.outcome }}" != "success" ]; then
            skipped_label="did not run (setup failed)"
            echo "::notice title=Guards did not run::the shared \`pnpm install\` did not succeed, so no guard evaluated its rule. Nothing below is a finding, and none of it counts towards a §4 promotion window."
          else
            skipped_label="did not run (run cancelled)"
          fi
          row() {
            case "$2" in
              success) label="clean" ;;
              skipped) label="$skipped_label" ;;
              cancelled) label="cancelled mid-run" ;;
              *)
                label="FINDING"
                echo "::warning title=WARN guard: $1::$1 reported a finding (outcome: $2). WARN does not fail the build — canon docs/ci-guardrails.md §2.1 — but the §4 promotion clock counts it. Open the step's log."
                ;;
            esac
            echo "| \`$1\` | $label |" >> "$GITHUB_STEP_SUMMARY"
            return 0
          }
          row tdd-signal "${{ steps.tdd-signal.outcome }}"
          row no-stub "${{ steps.no-stub.outcome }}"
          row workflow-auth "${{ steps.workflow-auth.outcome }}"
          row instruction-budget "${{ steps.instruction-budget.outcome }}"
          row ears-naming "${{ steps.ears-naming.outcome }}"
          row ears-test "${{ steps.ears-test.outcome }}"

  # ─── Meta-job: the single aggregate status check ────────────────────────────
  # The needs-list IS the BLOCK set (canon §2.1). Since #205 it names the light
  # guard BATCH rather than the individual BLOCK guards — the BLOCK/WARN split now
  # lives on the steps inside that job. WARN guards are still deliberately unable
  # to reach here; PR-body guards live in pr-body-guards.yml and cannot be listed
  # here at all (`needs` does not cross workflows — canon §2.1 says what to do
  # when one of them is promoted).
  #
  # The job name must stay literally `ci`: it is the context named in
  # .github/branch-protection.json, so renaming it silently unhooks the gate.
  ci:
    needs: [lint-and-typecheck, guards]
    if: always()
    runs-on: [self-hosted, linux, x64, bbm-ci, node22, light, ci]
    steps:
      # A required job must SUCCEED. `skipped` and `cancelled` are red too: a job
      # that never ran proved nothing, and treating only `failure` as red lets a
      # broken upstream job green the aggregate on a run where nothing was built
      # or tested.
      - name: Aggregate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed, was skipped, or was cancelled"; exit 1
          fi
          echo "All required jobs green"
