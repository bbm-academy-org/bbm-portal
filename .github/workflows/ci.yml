name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # ADR-002: machine-enforced module boundaries of the modular monolith
      - name: Module boundaries (dependency-cruiser)
        run: pnpm boundaries

      - name: Unit tests
        run: pnpm exec vitest run --config ./vitest.config.mts tests/unit
