name: Product note → Mattermost

# Deterministic delivery of a merged PR's «Product note (RU)» to the team's
# Mattermost channel (task 7.6, #137). No agent in the delivery path: the source
# of truth is the PR body, rendered by tools/ci/post-product-note.mjs.
#
# Trigger (#202): `push` to main, NOT `pull_request: closed`. This workflow runs
# on the shared BBM runner pool in the dedicated `notify` lane, and a manager
# policy that exposes a secret-bearing workflow must never trust PR events
# (REPOSITORY-ONBOARDING «Least-privilege notification webhook»). A merge into
# main IS a push of the squash/merge commit, so the merged PR is recovered from
# the pushed sha via `GET /repos/{owner}/{repo}/commits/{sha}/pulls`; a direct
# push that belongs to no merged PR delivers nothing and skips green.
#
# Secret-optional by design: the job is not blocked on the webhook being
# provisioned — with MATTERMOST_RELEASE_WEBHOOK_URL unset the script logs and
# skips green. It also skips green when the note is `none`/absent, which is how
# an internal-only PR opts out. There is no label gate here (unlike the ds
# original): this repo's PRs carry no labels, so the NOTE is the gate.
#
# The `## Product note (RU)` section itself landed with task 7.5 (#136), together
# with the `product-note` CI guard that makes it non-optional on a render-surface
# PR. That guard is the AUTHORING half; this workflow is the DELIVERY half. Both
# read the same section — 7.6 adds no second one.
#
# Environment marker: every delivered message carries an explicit footer, driven
# by DELIVERY_ENV. A merge into main does NOT reach production here — the deploy
# is a separate manual step — so the merge-triggered note is marked accordingly
# and the script refuses (exit 1) if the marker is unset or unknown.
#
# Injection safety: the PR body/title/url reach the script through variable
# assignment from `gh api` output and `env:`/`export`, never interpolated into
# a shell `run:` command line, so a `$(...)`/backtick in a body cannot be
# executed. The webhook JSON is built with JSON.stringify.

on:
  push:
    branches: [main]

# `pull-requests: read` is new with the push trigger: the event payload no
# longer carries the PR, so the resolve step reads it back by sha.
permissions:
  contents: read
  pull-requests: read

jobs:
  deliver:
    # Delivery lane: this workflow is reachable from push/deployment_status/
    # workflow_dispatch only, never `pull_request` — that separation is what
    # keeps MATTERMOST_RELEASE_WEBHOOK_URL out of reach of a fork PR, and it
    # matters more now that the repo is heading for public visibility (#214).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A push of a merged PR carries that PR's merge_commit_sha as its head.
      # `merged_at != null` keeps a commit that merely APPEARS in some open PR
      # from being mistaken for a merge.
      - name: Resolve the merged PR behind this push
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr_number="$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$SHA\" and .merged_at != null)][0].number // empty")"
          if [ -z "$pr_number" ]; then
            echo "No merged PR behind $SHA — direct push, nothing to deliver."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Post the product note to Mattermost
        if: steps.pr.outputs.found == 'true'
        env:
          MATTERMOST_RELEASE_WEBHOOK_URL: ${{ secrets.MATTERMOST_RELEASE_WEBHOOK_URL }}
          # Merged into main = it will ship with the next `pnpm deploy:prod`,
          # not "it is live". The footer says exactly that.
          DELIVERY_ENV: dev
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          PR_BODY="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.body // ""')"
          PR_TITLE="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.title')"
          PR_URL="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.html_url')"
          export PR_BODY PR_TITLE PR_URL
          node tools/ci/post-product-note.mjs
