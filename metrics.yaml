# Ручные значения metric-KR для OKR-дашборда (/okr, PRD FR-3).
#
# Ключ — стабильный kr_id: `kr<major>-<minor>` из имени Plane-модуля
# «KR <major>.<minor> · …» (модули пересоздаются со сменой OKR-периода,
# их UUID нестабильны — имя-конвенция переживает пересоздание).
#
# Поля записи:
#   current — текущее значение метрики; null = измерение не подключено
#             (KR ведётся как execution по задачам подготовки)
#   target  — целевое значение; null = цель не задана
#   unit    — единица для отображения
#   as_of   — дата значения (YYYY-MM-DD)
#
# Нет записи — KR тоже ведётся как execution. Пустота — сигнал, не ошибка.
#
# Каденс внесения значений (OQ-3): предложение — еженедельно перед командным
# созвоном, вносит владелец метрики. TODO(Антон): подтвердить каденс и владельцев.

# KR 1.1 · Кол-во подтверждённых баллов НМО — цель пока не задана
kr1-1:
  current: null
  target: null
  unit: баллов НМО
  as_of: 2026-07-24

# KR 2.1 · MAU 500 (цель снижена 5000 → 500, созвон 2026-07-23);
# измерение MAU не подключено → execution по задачам подготовки
kr2-1:
  current: null
  target: 500
  unit: MAU
  as_of: 2026-07-24

# KR 3.1 · 10 пользователей имеют статус эксперта до 01.09.2026
kr3-1:
  current: 0
  target: 10
  unit: экспертов
  as_of: 2026-07-24
