<!--
Тема: процесс работы с исполнителями, от решения привлечь до закрывающих. Флоу-диаграмма с дорожками по ролям и этапами 0–6, ниже — отдельная схема «Регулярное пополнение баланса».
Версия: 09.11.2026, ответы Консоли по заданию и предоплате. Сетевых запросов нет, шрифт системный.
-->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Процесс работы с исполнителями</title>
<style>
:root{
  --bg:#f7f7f5; --fg:#1d1f23; --muted:#5d636c; --line:#c4c8ce;
  --node:#ffffff; --node-line:#8d949d; --band-a:#f0f0ec; --band-b:#f7f7f5;
  --stage:#e6e7e2; --arrow:#4b5058;
  --accent:#b26a00; --accent-bg:#fff3dc;
  --auto:#1f7a8c;
  --panel:#ffffff; --chip:#eceee9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --fg:#e8e9eb; --muted:#a0a6ae; --line:#3a3f46;
    --node:#22262b; --node-line:#6a717a; --band-a:#1c1f23; --band-b:#16181b;
    --stage:#262a30; --arrow:#aab0b8;
    --accent:#f0b25a; --accent-bg:#3a2d14;
    --auto:#5fc0d0;
    --panel:#1e2125; --chip:#2a2e34;
  }
}
*{box-sizing:border-box}
html{overflow-y:scroll}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:12px 16px 6px;display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline}
h1{font-size:17px;margin:0}
.sub{color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:0 16px 8px;font-size:13px;color:var(--muted)}
.bar .it{display:inline-flex;align-items:center;gap:6px}
.bar button{font:inherit;font-size:13px;padding:2px 10px;border:1px solid var(--line);background:var(--node);color:var(--fg);border-radius:6px;cursor:pointer}
.bar button.on{border-color:var(--fg)}
.stage{display:flex;align-items:flex-start;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.col{flex:1 1 auto;min-width:0}
.wrap{flex:1 1 auto;min-width:0;overflow-x:auto}
.col .wrap{flex:none;width:100%}
svg{display:block}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.subp{border-top:1px solid var(--line)}
.subp h2{font-size:16px;margin:0;padding:12px 16px 2px}
.subp p{margin:0;padding:0 16px 8px;max-width:900px;color:var(--muted);font-size:13px}
.node{cursor:pointer;outline:none}
.node .box{fill:var(--node);stroke:var(--node-line);stroke-width:1}
.node.open .box{stroke:var(--accent);stroke-dasharray:5 3}
.node.sel .box{stroke:var(--fg);stroke-width:2;stroke-dasharray:none}
.node.open.sel .box{stroke:var(--accent);stroke-dasharray:5 3}
.node:focus-visible .box{stroke:var(--fg);stroke-width:2}
.node text{fill:var(--fg);font-size:14px}
.node.dec text{font-size:13px}
.chip rect{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1}
.chip text{fill:var(--accent);font-size:11px;font-weight:600}
.atag rect{fill:var(--chip);stroke:var(--node-line);stroke-width:1}
.node .atag text{fill:var(--muted);font-size:10px;font-weight:600}
.edge{fill:none;stroke:var(--arrow);stroke-width:1.4}
.edge.alt{stroke-dasharray:6 4}
.elabel rect{fill:var(--bg);opacity:.92}
.elabel text{fill:var(--muted);font-size:12px;font-style:italic}
.laneh{cursor:pointer;outline:none}
.laneh rect.hd{fill:none;stroke:var(--line);stroke-width:1}
.laneh.open rect.hd{stroke:var(--accent);stroke-dasharray:5 3}
.laneh:focus-visible rect.hd{stroke:var(--fg);stroke-width:2}
.laneh text{fill:var(--fg);font-size:13px;font-weight:600}
.stageh text{fill:var(--fg);font-size:13px;font-weight:700}
body.autoview .node:not(.has-auto){opacity:.3}
body.autoview .edge,body.autoview .elabel{opacity:.35}
body.autoview .node.has-auto .box{stroke:var(--auto);stroke-width:2.5;stroke-dasharray:none}
#panel{display:none;position:sticky;top:0;align-self:flex-start;flex:none;width:380px;max-height:100vh;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px 20px}
.stage.with-panel #panel{display:block}
#panel h2{margin:0 28px 2px 0;font-size:16px;line-height:1.3}
#panel .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
#panel h3{margin:12px 0 3px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
#panel pre{margin:0;white-space:pre-wrap;font:inherit}
#panel ul{margin:0;padding:0;list-style:none}
#panel li{margin:0 0 6px;padding-left:12px;position:relative}
#panel li::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:1px;background:var(--muted)}
#panel li.open::before{background:var(--accent)}
#pclose{position:absolute;top:10px;right:12px;width:28px;height:28px;border:1px solid var(--line);background:var(--node);color:var(--fg);border-radius:6px;cursor:pointer;font:inherit;line-height:1;padding:0}
.hint{color:var(--muted)}
@media (max-width:900px){
  .stage.with-panel{flex-direction:column;align-items:stretch}
  #panel{position:static;width:100%;max-height:none;border-left:0;border-top:1px solid var(--line)}
  .wrap{width:100%}
}
</style>
</head>
<body>
<header>
  <h1>Процесс работы с исполнителями</h1>
  <span class="sub">от решения привлечь до закрывающих · дорожки по ролям · этапы 0–6 · нажмите на шаг или дорожку, чтобы увидеть детали и вопросы</span>
</header>
<div class="bar">
  <span class="it"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="var(--arrow)" stroke-width="1.4"/></svg>порядок шагов</span>

  <span class="it"><svg width="34" height="16"><rect x="1" y="2" width="32" height="12" rx="3" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="5 3"/></svg>пунктир — вопрос открыт, нарисован предлагаемый вариант</span>

<script>
(function(){
var DATA={
  "lanes": [
    {
      "id": "l1",
      "title": "Заказчик",
      "q": []
    },
    {
      "id": "l2",
      "title": "Исполнитель",

      "lane": "l1",
      "col": 0,
      "title": "Формулирует задачу",

      "auto": "Подтверждение приходит уведомлением",
      "q": ["Как фиксируем подтверждение условий?"]
    },
    {
      "id": "e3",
      "lane": "l2",
      "col": 2,
      "title": "Выполняет работу",
      "now": "Делает работу по заданию и сдаёт результат заказчику.",
      "auto": "",
      "open": true,
      "q": []
    },
    {
      "id": "d1",
      "lane": "l1",
      "col": 3,
      "title": "Результат принят?",
      "kind": "decision",
      "now": "Заказчик проверяет результат на соответствие заданию.\nЕсли нужны правки, возвращает работу исполнителю.",
      "auto": "",

    },
    {

      "lane": "l3",
      "col": 4,
      "title": "Проверяет документы",

    },

  ],

  ],
  "subprocess": {
    "title": "Согласование изменений задания",
    "about": "Отдельная короткая схема: что делаем, если задание меняется по ходу работы.",
    "lanes": [
      {
        "id": "p_l1",
        "title": "Заказчик"
      },
      {
        "id": "p_l2",
        "title": "Исполнитель"
      },
      {
        "id": "p_l3",
        "title": "Финансы"
      }
    ],
    "steps": [
      {
        "id": "p1",
        "lane": "p_l1",
        "col": 0,
        "title": "Описывает изменение",
        "now": "Фиксирует, что меняется в задании и как это влияет на срок.",
        "auto": "",
        "open": false,
        "q": []
      },
      {
        "id": "p2",
        "lane": "p_l2",
        "col": 1,
        "title": "Оценивает изменение",
        "now": "Исполнитель называет новый срок и стоимость.",
        "auto": "",
        "open": true,
        "q": ["Кто принимает решение, если стоимость выросла?"]
      },
      {
        "id": "p3",
        "lane": "p_l3",
        "col": 2,
        "title": "Обновляет условия оплаты",
        "now": "Финансы вносят новые условия в учёт.",
        "auto": "Условия обновляются автоматически",
        "open": false,
        "q": []
      }
    ],
    "edges": [
      {
        "from": "p1",
        "to": "p2"
      },
      {
        "from": "p2",
        "to": "p3",
        "label": "согласовано"
      }
    ]
  }
};
var LW=150, NW=130, LINE=17, PADX=13, PADY=16, DW=140;
var NH=76, LH=NH+2*PADY;
var NS='http://www.w3.org/2000/svg';
var FONT='14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
var DFONT='13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
var OPEN_LABEL='вопрос открыт', AUTO_LABEL='авто';
var SUBNAME=DATA.subprocess.title;

var ctx=document.createElement('canvas').getContext('2d');
function wrap(text,maxW,font,maxLines){
  ctx.font=font; var words=text.split(/\s+/), lines=[], cur='';
  words.forEach(function(w){
    var tryS=cur?cur+' '+w:w;
    if(ctx.measureText(tryS).width<=maxW||!cur){cur=tryS;}else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  if(maxLines&&lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,'')+'…';}
  return lines;
}
/* блок растёт по самому длинному заголовку: 4 строки и больше не режем; размер один для обеих схем */
var allSteps=DATA.steps.concat(DATA.subprocess.steps), maxL=4, DH;
allSteps.forEach(function(n){
  if(n.kind==='decision'){n.lines=wrap(n.title,DW*0.72,DFONT);}
  else{n.lines=wrap(n.title,NW-20,FONT);maxL=Math.max(maxL,n.lines.length);}
});
NH=Math.max(NH,maxL*LINE+24); LH=NH+2*PADY; DH=NH+16;

function el(name,attrs,parent){var e=document.createElementNS(NS,name);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function chip(parent,cx,y){
  ctx.font='600 11px system-ui';
  var cw=Math.ceil(ctx.measureText(OPEN_LABEL).width)+16;
  var g=el('g',{'class':'chip'},parent);
  el('rect',{x:cx-cw/2,y:y,width:cw,height:16,rx:8},g);
  var t=el('text',{x:cx,y:y+12,'text-anchor':'middle'},g); t.textContent=OPEN_LABEL;
}
function autotag(parent,right,y){
  ctx.font='600 10px system-ui';
  var aw=Math.ceil(ctx.measureText(AUTO_LABEL).width)+12;
  var g=el('g',{'class':'atag'},parent);
  el('rect',{x:right-aw,y:y,width:aw,height:14,rx:7},g);
  var t=el('text',{x:right-aw/2,y:y+10.5,'text-anchor':'middle'},g); t.textContent=AUTO_LABEL;
}

/* панель: одна на обе схемы */
var stageEl=document.getElementById('stage');
var panel=document.getElementById('panel'), pbody=document.getElementById('pbody'), selEl=null;
function section(title,node){
  var h=document.createElement('h3'); h.textContent=title; pbody.appendChild(h); pbody.appendChild(node);
}
function qlist(qs,open){
  var ul=document.createElement('ul');
  qs.forEach(function(q){var li=document.createElement('li'); if(open)li.className='open'; li.textContent=q; ul.appendChild(li);});
  return ul;
}
var diagrams=[];
function syncAll(){diagrams.forEach(function(d){d.syncLabels();});}
function show(title,meta,n,qs,open,about){
  pbody.textContent='';
  var h=document.createElement('h2'); h.textContent=title; pbody.appendChild(h);
  if(meta){var mm=document.createElement('div'); mm.className='meta'; mm.textContent=meta; pbody.appendChild(mm);}
  if(n){
    if(n.now){var p1=document.createElement('pre'); p1.textContent=n.now; section('Сейчас',p1);}
    if(n.auto){var p2=document.createElement('pre'); p2.textContent=n.auto; section('Автоматизация',p2);}
  }
  if(about){var p3=document.createElement('pre'); p3.textContent=about; section('О роли',p3);}
  if(qs&&qs.length) section('Вопросы',qlist(qs,open));
  else if(!n){var s=document.createElement('div'); s.className='hint'; s.style.marginTop='10px'; s.textContent='Вопросов к этой дорожке нет.'; pbody.appendChild(s);}
  stageEl.classList.add('with-panel');
  syncAll();
}
function closePanel(){
  if(selEl){selEl.classList.remove('sel'); selEl=null;}
  stageEl.classList.remove('with-panel');
  syncAll();
}
document.getElementById('pclose').addEventListener('click',closePanel);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&stageEl.classList.contains('with-panel'))closePanel();});
function openFor(fn){
  fn();
  if(window.matchMedia('(max-width:900px)').matches) panel.scrollIntoView({block:'nearest'});
}

/* схема в заданный svg: общий движок для основной и вспомогательной схем */
function drawDiagram(D,o){
  var CW=o.CW, TOP=o.TOP, svg=o.svg, wrapEl=o.wrapEl;
  var lanes=D.lanes, nodes=D.steps, edges=D.edges, stages=D.stages||[];
  var laneIdx={}, byId={}, NC=1;
  lanes.forEach(function(l,i){laneIdx[l.id]=i;});
  nodes.forEach(function(n){byId[n.id]=n; NC=Math.max(NC,n.col+1);});
  var W=LW+NC*CW+10, H=TOP+lanes.length*LH+6;
  nodes.forEach(function(n){
    var dec=n.kind==='decision';
    n.bw=dec?DW:NW; n.bh=dec?DH:NH;
    n.cx=LW+n.col*CW+CW/2; n.cy=TOP+laneIdx[n.lane]*LH+LH/2;
    n.bx=n.cx-n.bw/2; n.by=n.cy-n.bh/2;
  });
  svg.setAttribute('viewBox','0 0 '+W+' '+H);

  var defs=el('defs',{},svg);
  var mk=el('marker',{id:'arrow-'+o.name,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'8',markerHeight:'8',orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--arrow)'},mk);

  /* полосы дорожек */
  lanes.forEach(function(l,i){
    el('rect',{x:0,y:TOP+i*LH,width:W,height:LH,fill:i%2?'var(--band-b)':'var(--band-a)'},svg);
  });
  /* заголовки этапов (у схемы без этапов шапки нет) */
  stages.forEach(function(s,i){
    var x=LW+s.c0*CW, w=(s.c1-s.c0+1)*CW;
    var g=el('g',{'class':'stageh'},svg);
    el('rect',{x:x+1,y:4,width:w-2,height:TOP-10,rx:6,fill:'var(--stage)'},g);
    var lines=wrap(s.title,w-14,'700 13px system-ui',2);
    var t=el('text',{x:x+w/2,y:4+(TOP-10)/2+5-(lines.length-1)*7.5,'text-anchor':'middle'},g);
    lines.forEach(function(ln,k){var ts=el('tspan',{x:x+w/2,dy:k?15:0},t);ts.textContent=ln;});
    if(i>0) el('line',{x1:x,y1:TOP,x2:x,y2:H,stroke:'var(--line)','stroke-dasharray':'2 4'},svg);
  });

  /* маршруты стрелок: ортогональные, первый вариант, который не задевает чужие блоки.
     Сначала строгий проход (порт не занят другой стрелкой), потом любой. */
  function port(n,side){
    return side==='L'?[n.bx,n.cy]:side==='R'?[n.bx+n.bw,n.cy]:side==='T'?[n.cx,n.by]:[n.cx,n.by+n.bh];
  }
  function cands(a,b){
    var out=[], aR=a.bx+a.bw, up=b.cy<a.cy, down=b.cy>a.cy;
    function add(sp,dp,pts){out.push({sp:sp,dp:dp,pts:pts});}
    if(Math.abs(a.cy-b.cy)<1&&b.bx>aR) add('R','L',[port(a,'R'),port(b,'L')]);
    if(Math.abs(a.cx-b.cx)<1&&down) add('B','T',[port(a,'B'),port(b,'T')]);
    if(Math.abs(a.cx-b.cx)<1&&up) add('T','B',[port(a,'T'),port(b,'B')]);
    if(b.bx>=aR+PADX&&Math.abs(a.cy-b.cy)>=1){
      var gx=b.bx-PADX;
      add('R','L',[port(a,'R'),[gx,a.cy],[gx,b.cy],port(b,'L')]);
      add('R',down?'T':'B',[port(a,'R'),[b.cx,a.cy],port(b,down?'T':'B')]);
    }
    if(b.bx>a.cx&&Math.abs(a.cy-b.cy)>=1){
      add(down?'B':'T','L',[port(a,down?'B':'T'),[a.cx,b.cy],port(b,'L')]);
    }
    return out;
  }
  var MARG=3;
  function segHit(p,q,r){
    var x1=Math.min(p[0],q[0]), x2=Math.max(p[0],q[0]), y1=Math.min(p[1],q[1]), y2=Math.max(p[1],q[1]);
    return x2>r.bx-MARG&&x1<r.bx+r.bw+MARG&&y2>r.by-MARG&&y1<r.by+r.bh+MARG;
  }
  function clear(pts,a,b){
    for(var i=0;i<pts.length-1;i++)
      for(var k=0;k<nodes.length;k++){
        var n=nodes[k]; if(n===a||n===b)continue;
        if(segHit(pts[i],pts[i+1],n))return false;
      }
    return true;
  }
  var usedOut={}, usedIn={};
  edges.forEach(function(e){
    var a=byId[e.from], b=byId[e.to], cs=cands(a,b), pick=null;
    for(var pass=0;pass<2&&!pick;pass++)
      for(var i=0;i<cs.length&&!pick;i++){
        var c=cs[i];
        if(!clear(c.pts,a,b))continue;
        if(pass===0&&(usedOut[a.id+c.sp]||usedIn[b.id+c.dp]))continue;
        pick=c;
      }
    if(!pick)pick=cs[0];
    e.pts=pick.pts; usedOut[a.id+pick.sp]=1; usedIn[b.id+pick.dp]=1;
  });
  var eg=el('g',{},svg), lg=el('g',{},svg);
  edges.forEach(function(e){
    var d='M'+e.pts.map(function(q){return q[0]+','+q[1];}).join(' L');
    el('path',{d:d,'class':'edge'+(e.alt?' alt':''),'marker-end':'url(#arrow-'+o.name+')'},eg);
  });

  /* подписи стрелок: на самом длинном отрезке, не на блоках и не на других стрелках */
  function segsOf(e){var s=[];for(var i=0;i<e.pts.length-1;i++)s.push([e.pts[i],e.pts[i+1]]);return s;}
  function rectHit(r,q,m){return r.x+r.w>q.bx-m&&r.x<q.bx+q.bw+m&&r.y+r.h>q.by-m&&r.y<q.by+q.bh+m;}
  function rr(a,b){return a.x+a.w>b.x&&a.x<b.x+b.w&&a.y+a.h>b.y&&a.y<b.y+b.h;}
  function segRect(s,r){
    var x1=Math.min(s[0][0],s[1][0]), x2=Math.max(s[0][0],s[1][0]), y1=Math.min(s[0][1],s[1][1]), y2=Math.max(s[0][1],s[1][1]);
    return x2>r.x-1&&x1<r.x+r.w+1&&y2>r.y-1&&y1<r.y+r.h+1;
  }
  var placed=[];
  edges.forEach(function(e){
    if(!e.label)return;
    ctx.font='italic 12px system-ui';
    var tw=Math.ceil(ctx.measureText(e.label).width)+10, th=18;
    var ss=segsOf(e).map(function(s){return {s:s,L:Math.abs(s[1][0]-s[0][0])+Math.abs(s[1][1]-s[0][1])};}).sort(function(p,q){return q.L-p.L;});
    var list=[];
    ss.forEach(function(o2){
      var s=o2.s, mx=(s[0][0]+s[1][0])/2, my=(s[0][1]+s[1][1])/2;
      if(Math.abs(s[0][1]-s[1][1])<1){
        list.push({r:{x:mx-tw/2,y:my-th-3,w:tw,h:th},host:s},{r:{x:mx-tw/2,y:my+3,w:tw,h:th},host:s});
      }else{
        list.push({r:{x:s[0][0]+6,y:my-th/2,w:tw,h:th},host:s},{r:{x:s[0][0]-6-tw,y:my-th/2,w:tw,h:th},host:s});
      }
    });
    function ok(c,strict){
      var r=c.r;
      if(r.x<LW+2||r.x+r.w>W-2||r.y<TOP||r.y+r.h>H)return false;
      for(var k=0;k<nodes.length;k++)if(rectHit(r,nodes[k],2))return false;
      for(var j=0;j<placed.length;j++)if(rr(r,placed[j]))return false;
      if(strict)for(var m=0;m<edges.length;m++){
        var sg=segsOf(edges[m]);
        for(var z=0;z<sg.length;z++){ if(sg[z]===c.host)continue; if(segRect(sg[z],r))return false; }
      }
      return true;
    }
    var pick=null;
    for(var pass=0;pass<2&&!pick;pass++)
      for(var i=0;i<list.length&&!pick;i++) if(ok(list[i],pass===0)) pick=list[i];
    if(!pick)pick=list[0];
    var r=pick.r; placed.push(r); e.labelRect=r;
    var g=el('g',{'class':'elabel'},lg);
    el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:3},g);
    var t=el('text',{x:r.x+5,y:r.y+13},g); t.textContent=e.label;
  });

  /* подписи дорожек: остаются на месте при горизонтальной прокрутке */
  function scale(){return svg.getBoundingClientRect().width/W;}
  var lbl=el('g',{id:'lanelabels-'+o.name},svg);
  lanes.forEach(function(l,i){
    el('rect',{x:0,y:TOP+i*LH,width:LW,height:LH,fill:i%2?'var(--band-b)':'var(--band-a)'},lbl);
  });
  if(TOP>0) el('rect',{x:0,y:0,width:LW,height:TOP,fill:'var(--bg)'},lbl);
  lanes.forEach(function(l,i){
    var y=TOP+i*LH;
    var g=el('g',{'class':'laneh'+(l.open?' open':''),tabindex:'0',role:'button'},lbl);
    el('rect',{'class':'hd',x:3,y:y+3,width:LW-8,height:LH-6,rx:8},g);
    var lines=wrap(l.title,LW-30,'600 13px system-ui',5);
    var t=el('text',{x:14,y:y+LH/2+5-(lines.length-1)*8-(l.open?8:0)},g);
    lines.forEach(function(ln,k){var ts=el('tspan',{x:14,dy:k?16:0},t);ts.textContent=ln;});
    if(l.open) chip(g,LW/2-2,y+LH-24);
    function act(){
      openFor(function(){
        if(selEl)selEl.classList.remove('sel'); selEl=null;
        show(l.title,null,null,l.q,l.open,l.about);
      });
    }
    g.addEventListener('click',act);
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
  });
  function syncLabels(){
    var s=scale(); if(!s)return;
    lbl.setAttribute('transform','translate('+(wrapEl.scrollLeft/s)+',0)');
  }
  wrapEl.addEventListener('scroll',syncLabels);

  /* прокрутка: выбранный шаг в видимую часть области схемы */
  function reveal(n,g){
    var s=scale(), mg=16;
    var left=n.bx*s, right=(n.bx+n.bw)*s, lab=LW*s, vw=wrapEl.clientWidth, sl=wrapEl.scrollLeft;
    if(left<sl+lab+mg) wrapEl.scrollLeft=Math.max(0,left-lab-mg);
    else if(right>sl+vw-mg) wrapEl.scrollLeft=right-vw+mg;
    syncLabels();
    var r=g.getBoundingClientRect();
    if(r.top<mg) window.scrollBy(0,r.top-mg);
    else if(r.bottom>window.innerHeight-mg) window.scrollBy(0,r.bottom-window.innerHeight+mg);
  }

  /* шаги */
  var nodeLayer=el('g',{},svg);
  svg.insertBefore(nodeLayer,lbl);
  nodes.forEach(function(n){
    var lane=lanes[laneIdx[n.lane]], dec=n.kind==='decision';
    var g=el('g',{'class':'node'+(n.open?' open':'')+(n.auto?' has-auto':'')+(dec?' dec':''),transform:'translate('+n.bx+','+n.by+')',tabindex:'0',role:'button'},nodeLayer);
    if(dec) el('polygon',{'class':'box',points:'0,'+n.bh/2+' '+n.bw/2+',0 '+n.bw+','+n.bh/2+' '+n.bw/2+','+n.bh},g);
    else el('rect',{'class':'box',width:n.bw,height:n.bh,rx:8},g);
    var lines=n.lines, shift=(n.open&&!dec)?7:0;
    var t=el('text',{x:n.bw/2,y:n.bh/2+5-(lines.length-1)*LINE/2-shift,'text-anchor':'middle'},g);
    lines.forEach(function(ln,k){var ts=el('tspan',{x:n.bw/2,dy:k?LINE:0},t);ts.textContent=ln;});
    if(n.open) chip(g,n.bw/2,dec?-8:n.bh-22);
    if(n.auto) autotag(g,n.bw-6,-7);
    function act(){
      openFor(function(){
        if(selEl)selEl.classList.remove('sel'); g.classList.add('sel'); selEl=g;
        var st=stages.filter(function(s){return n.col>=s.c0&&n.col<=s.c1;})[0];
        show(n.title,lane.title+(st?' · '+st.title:o.name==='sub'?' · '+SUBNAME:''),n,n.q,n.open);
        reveal(n,g);
      });
    }
    g.addEventListener('click',act);
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
  });
  var d={W:W,H:H,svg:svg,wrapEl:wrapEl,syncLabels:syncLabels,nodes:nodes,edges:edges,lanes:lanes,LH:LH,TOP:TOP};
  diagrams.push(d);
  return d;
}

var main=drawDiagram({lanes:DATA.lanes,stages:DATA.stages,steps:DATA.steps,edges:DATA.edges},
  {name:'main',svg:document.getElementById('svg'),wrapEl:document.getElementById('wrap'),CW:156,TOP:48});
var SP=DATA.subprocess;
document.getElementById('subt').textContent=SP.title;
document.getElementById('suba').textContent=SP.about;
var sub=drawDiagram({lanes:SP.lanes,stages:null,steps:SP.steps,edges:SP.edges},
  {name:'sub',svg:document.getElementById('svg2'),wrapEl:document.getElementById('wrap2'),CW:240,TOP:6});
if(window.__SCHEMA_TEST)window.__SCHEMA_TEST.diagrams=diagrams;

/* подсветка автоматизации */
var bauto=document.getElementById('bauto');
bauto.onclick=function(){
  var on=document.body.classList.toggle('autoview');
  bauto.classList.toggle('on',on); bauto.setAttribute('aria-pressed',on?'true':'false');
};

/* масштаб: подпроцесс в том же масштабе, что и основная схема */
var b100=document.getElementById('b100'), bfit=document.getElementById('bfit'), mode='fit';
function applyScale(){
  if(mode==='fit'){
    var w=stageEl.clientWidth, k=w/main.W;
    main.svg.style.width=w+'px'; main.svg.style.height='auto';
    sub.svg.style.width=Math.round(sub.W*k)+'px'; sub.svg.style.height='auto';
  }else{
    main.svg.style.width=main.W+'px'; main.svg.style.height=main.H+'px';
    sub.svg.style.width=sub.W+'px'; sub.svg.style.height=sub.H+'px';
  }
  b100.classList.toggle('on',mode!=='fit'); bfit.classList.toggle('on',mode==='fit');
  syncAll();
}
b100.onclick=function(){mode='100';applyScale();};
bfit.onclick=function(){mode='fit';applyScale();};
window.addEventListener('resize',applyScale);
applyScale();
})();
</script>
